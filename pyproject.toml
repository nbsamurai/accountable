[project]
name = "accountable"
version = "0.1.0"
description = "Accountable: a sales CRM for one salesperson"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.165",
    "uvicorn>=0.54",
    "pydantic>=2.14",
    "sqlalchemy>=2.1",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.9",
    "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "httpx2>=2.16",
    "ruff>=0.17.6",
    "ty>=0.0.107",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

# `uv run alembic revision -m "..."` makes a new migration. The app runs them when it starts.
[tool.alembic]
script_location = "backend/migrations"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff.lint]
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15
