name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Gitleaks scans the whole history, so fetch all of it.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check
          mkdir bin && tar -xzf gitleaks.tar.gz -C bin gitleaks
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Scan the repository for secrets
        run: gitleaks git --log-opts=--all --redact --verbose --no-banner .

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: |
          npm ci
          uv sync --locked

      # The end-to-end tests run only on a developer's computer, in npm run check.
      - name: Run the quick checks
        run: npm run check:quick
